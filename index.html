<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanjay Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND VIDEO -->
    <video class="background-video" autoplay muted loop playsinline>
        <source src="kumardance.mp4" type="video/mp4">
    </video>

    <!-- DARK LAYER OVER VIDEO -->
    <div class="overlay"></div>


    <!-- QUESTION -->
    <main class="question-box">

        <h1>Sanjay oda original per enna?</h1>

        <div class="options">

            <button onclick="checkAnswer('potta')">
                A) Potta Kumar
            </button>

            <button onclick="checkAnswer('pombala')">
                B) Pombala Kumar
            </button>

            <button onclick="checkAnswer('punda')">
                C) Punda Kumar
            </button>

            <button onclick="checkAnswer('bot')">
                D) Bot Kumar
            </button>

        </div>

        <p id="result"></p>

    </main>


    <script src="script.js"></script>

</body>

</html>
