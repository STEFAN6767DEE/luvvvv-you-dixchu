<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffe4ec">

    <title>For Dixu ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px 14px;
            display: flex;
            justify-content: center;
            align-items: flex-start;

            font-family: 'Plus Jakarta Sans', Arial, sans-serif;

            background:
                linear-gradient(rgba(20, 5, 15, 0.35), rgba(20, 5, 15, 0.45)),
                url("luvv.jpg") center center / cover no-repeat;
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: auto;
        }

        .card {
            width: 100%;
            padding: 26px 18px;
            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 26px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);

            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
        }

        .heart {
            font-family: "Segoe UI Emoji", "Apple Color Emoji",
                         "Noto Color Emoji", sans-serif;
            font-size: 42px;
            margin-bottom: 12px;
        }

        h1 {
            color: #fff;
            font-family: 'Caveat', cursive;
            font-size: clamp(29px, 7vw, 37px);
            font-weight: 700;
            line-height: 1.3;
            overflow-wrap: anywhere;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .message {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.9;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            margin-bottom: 22px;
        }

        .song {
            width: 100%;
            padding: 12px;
            margin-bottom: 22px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px;
        }

        .song-title {
            color: #fff;
            font-family: 'Caveat', cursive;
            font-size: 25px;
            font-weight: 700;
            line-height: 1.5;
            overflow-wrap: anywhere;
            margin-bottom: 12px;
        }

        video {
            display: block;
            width: 100%;
            max-height: 50vh;
            max-height: 50dvh;
            object-fit: contain;
            background: #111;
            border-radius: 12px;
        }

        .final-message {
            color: #fff;
            font-family: 'Caveat', cursive;
            font-size: 25px;
            font-weight: 700;
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        #annoy-btn {
            display: block;
            width: 100%;
            min-height: 52px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 30px;

            background: rgba(244, 63, 94, 0.9);
            color: #fff;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.5;

            cursor: pointer;
            overflow-wrap: anywhere;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s, transform 0.2s;
        }

        #annoy-btn:hover {
            background: #e11d48;
            transform: translateY(-2px);
        }

        #annoy-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            body {
                background-attachment: scroll;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #annoy-btn {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">

            <div class="heart" aria-hidden="true">💌</div>

            <h1>
                Neeeyuuuuuu naaaanu romba naal ah
                pesrom la challlo ❤️
            </h1>

            <p class="message">
                Naa unnna ethachu thappa pesirnthaa
                srrry athukaaga unakkaga intha song <3
            </p>

            <div class="song">
                <p class="song-title">
                    ennai nee mannipayaaaaaaa??❤️
                </p>

                <video controls playsinline preload="metadata">
                    <source src="song.mp4" type="video/mp4">
                    Your browser does not support this video.
                </video>
            </div>

            <p class="final-message">
                Irunthaalu unna kaduppetha pudichurku 😂❤️
            </p>

            <a href="annoyed.html">
                <button id="annoy-btn" type="button">
                    Click here to get annoyed 🏃‍♂️
                </button>
            </a>

        </section>
    </main>
</body>
</html>
